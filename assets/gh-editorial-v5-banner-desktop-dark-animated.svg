<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 323" role="img" aria-labelledby="title desc">
<title id="title">Tim Wong | Test AI. Turn complexity into clarity.</title>
<desc id="desc">A refined typographic profile introduction with an annotated side note.</desc>
<rect width="1200" height="323" fill="#0d1117" />
<text x="36" y="39" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4" text-anchor="start" fill="#a1aab4">TIM WONG   /   BUILDING</text><line x1="36" y1="57" x2="800" y2="57" stroke="#30363d" stroke-width="1" opacity="1"/>
 <text x="36" y="128" font-family="Georgia,'Times New Roman',serif" font-size="51" font-weight="700"  text-anchor="start" fill="#e6edf3">Test the limits of AI.</text>
 <text x="36" y="188" font-family="Georgia,'Times New Roman',serif" font-size="48" font-weight="700"  text-anchor="start" fill="#b8ceb0">Turn complexity into clarity.</text>
 <text x="38" y="239" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400"  text-anchor="start" fill="#a1aab4">Curious by default. Building useful solutions and automations.</text>
 <line x1="37" y1="270" x2="799" y2="270" stroke="#30363d" stroke-width="1" opacity="1"/>
 <text x="38" y="297" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.45" text-anchor="start" fill="#a1aab4">EXPERIMENT     /     UNDERSTAND     /     BUILD     /     REFINE</text>
 <line x1="844" y1="52" x2="844" y2="282" stroke="#30363d" stroke-width="1" opacity="1"/>
 <text x="881" y="76" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.15" text-anchor="start" fill="#d9a389">THE WORKING NOTE</text>
 <text x="881" y="127" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="400"  text-anchor="start" fill="#e6edf3">A question.<animate attributeName="opacity" values=".4;1;.4" dur="7.5s" begin="0s" repeatCount="indefinite"/></text>
 <text x="881" y="173" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="400"  text-anchor="start" fill="#e6edf3">An experiment.<animate attributeName="opacity" values=".4;1;.4" dur="7.5s" begin="2.5s" repeatCount="indefinite"/></text>
 <text x="881" y="219" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="400"  text-anchor="start" fill="#e6edf3">A better way.<animate attributeName="opacity" values=".4;1;.4" dur="7.5s" begin="5s" repeatCount="indefinite"/></text>
 <line x1="880" y1="245" x2="1158" y2="245" stroke="#30363d" stroke-width="1" opacity="1"/>
 <text x="881" y="278" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400"  text-anchor="start" fill="#a1aab4">Always curious. Always learning.</text>
 <circle cx="1152" cy="65" r="4" fill="#b8ceb0"><animate attributeName="r" values="4;9;4" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".45;1;.45" dur="3.2s" repeatCount="indefinite"/></circle>
<circle cx="36" cy="57" r="3.4" fill="#d9a389"><animate attributeName="cx" values="36;800;36" keyTimes="0;.73;1" dur="10s" repeatCount="indefinite"/></circle>
    <rect x="278" y="28" width="6" height="17" rx="1" fill="#b8ceb0"><animate attributeName="opacity" values=".8;.07;.8" dur="1.8s" repeatCount="indefinite"/></rect>
</svg>
