<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 351" role="img" aria-labelledby="title desc">
<title id="title">Tim Wong | Turning problems into useful solutions</title>
<desc id="desc">Editorial headline with animated pencil rules tracing a question, an experiment, and a solution.</desc>
<rect width="1200" height="351" fill="#0d1117"/>
<text x="40" y="44" fill="#a1aab4" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="1.25">TIM WONG    /    BUILDING</text>
<path d="M40 65L809 65" fill="none" stroke="#30363d" stroke-width="1.4" opacity="1"/>
<text x="40" y="139" fill="#e6edf3" font-family="Georgia,'Times New Roman',serif" font-size="54" font-weight="700" >Test the limits of AI.</text>
<text x="40" y="205" fill="#b8ceb0" font-family="Georgia,'Times New Roman',serif" font-size="48" font-weight="700" >Turn complexity into clarity.</text>
<text x="42" y="251" fill="#a1aab4" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" >Curious by default. Building practical tools and automations.</text>
<path d="M42 284L808 284" fill="none" stroke="#30363d" stroke-width="1" opacity="1"/>
<text x="42" y="314" fill="#a1aab4" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.9">ASK  /  EXPERIMENT  /  SOLVE  /  IMPROVE</text>
<path d="M841 41L841 325" fill="none" stroke="#30363d" stroke-width="1" opacity="1"/>
<text x="870" y="45" fill="#d9a389" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">A WORKING NOTE</text>
<text x="875" y="93" fill="#e6edf3" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="700" >01   A QUESTION</text><text x="876" y="119" fill="#a1aab4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" >Understand the problem</text>
<path d="M876 128L1157 128" fill="none" stroke="#30363d" stroke-width="1" opacity="1"/>
<path d="M876 128H1157" fill="none" stroke="#b8ceb0" stroke-width="2.7" opacity=".16" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M876 128H1157" fill="none" stroke="#b8ceb0" stroke-width="2.7" stroke-dasharray="282" stroke-dashoffset="282" stroke-linecap="round" stroke-linejoin="round" >
<animate attributeName="stroke-dashoffset" values="282;282;0;0;282" keyTimes="0;.08;.29;.82;1" dur="16s" begin="0s" repeatCount="indefinite"/>
</path>
<text x="875" y="170" fill="#e6edf3" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="700" >02   AN EXPERIMENT</text><text x="876" y="196" fill="#a1aab4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" >Try an idea</text>
<path d="M876 205L1157 205" fill="none" stroke="#30363d" stroke-width="1" opacity="1"/>
<path d="M876 205H1157" fill="none" stroke="#b8ceb0" stroke-width="2.7" opacity=".16" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M876 205H1157" fill="none" stroke="#b8ceb0" stroke-width="2.7" stroke-dasharray="282" stroke-dashoffset="282" stroke-linecap="round" stroke-linejoin="round" >
<animate attributeName="stroke-dashoffset" values="282;282;0;0;282" keyTimes="0;.08;.29;.82;1" dur="16s" begin="2.6s" repeatCount="indefinite"/>
</path>
<text x="875" y="247" fill="#e6edf3" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="700" >03   A BETTER WAY</text><text x="876" y="273" fill="#a1aab4" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" >Make something useful</text>
<path d="M876 282L1157 282" fill="none" stroke="#30363d" stroke-width="1" opacity="1"/>
<path d="M876 282H1157" fill="none" stroke="#b8ceb0" stroke-width="2.7" opacity=".16" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M876 282H1157" fill="none" stroke="#b8ceb0" stroke-width="2.7" stroke-dasharray="282" stroke-dashoffset="282" stroke-linecap="round" stroke-linejoin="round" >
<animate attributeName="stroke-dashoffset" values="282;282;0;0;282" keyTimes="0;.08;.29;.82;1" dur="16s" begin="5.2s" repeatCount="indefinite"/>
</path>
<path d="M42 218 H635" fill="none" stroke="#d9a389" stroke-width="3.2" opacity=".16" stroke-linecap="round" stroke-linejoin="round"/>
