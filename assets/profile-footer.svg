<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 123" role="img" aria-labelledby="title desc">
<title id="title">Build small. Learn fast. Make it useful.</title><desc id="desc">A closing note about practical experimentation.</desc>
<rect width="1080" height="123" rx="5" fill="#2F382F"/>
<rect x="13" y="13" width="1054" height="97" rx="2" fill="none" stroke="#6B7568" stroke-width="1.2"/>
<text x="540" y="61" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="35" font-weight="700" fill="#F7F4EC">Build small. Learn fast. Make it useful.</text>
<text x="540" y="89" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12.6" letter-spacing="1.6" fill="#E0E1D4">ALWAYS CURIOUS. ALWAYS IMPROVING.</text>
<rect x="111" y="60" width="60" height="2" fill="#89917C"/>
<rect x="909" y="60" width="60" height="2" fill="#89917C"/>
