<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 103" role="img" aria-labelledby="title desc">
<title id="title">Build small. Learn fast. Make it useful.</title>
<desc id="desc">A quiet closing message in a muted GitHub-aligned surface.</desc>

<rect width="1080" height="103" fill="#0d1117" />
<rect x="0" y="12" width="1080" height="78" rx="3" fill="#161b22"/>
  <text x="540" y="51" font-family="Georgia,'Times New Roman',serif" font-size="32" font-weight="700"  text-anchor="middle" fill="#e6edf3">Build small. Learn fast. Make it useful.</text>
  <text x="540" y="75" font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="#a1aab4">ALWAYS CURIOUS. ALWAYS IMPROVING.</text>
</svg>
