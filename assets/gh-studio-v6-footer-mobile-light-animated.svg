<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 148" role="img" aria-labelledby="title desc">
<title id="title">Make it useful</title>
<desc id="desc">A clean, quiet ending with a drawn line that writes itself.</desc>
<rect width="360" height="148" fill="#ffffff"/>
<rect x="0" y="9" width="360" height="130" fill="#f6f8fa"/>
<text x="180" y="50" fill="#24292f" font-family="Georgia,'Times New Roman',serif" font-size="25" font-weight="700" text-anchor="middle">Build small. Learn fast.</text>
<text x="180" y="80" fill="#24292f" font-family="Georgia,'Times New Roman',serif" font-size="25" font-weight="700" text-anchor="middle">Make it useful.</text>
<path d="M43 110L317 110" fill="none" stroke="#d1d9e0" stroke-width="1" opacity="1"/>
<path d="M43 110H317" fill="none" stroke="#4d6548" stroke-width="3" opacity=".16" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M43 110H317" fill="none" stroke="#4d6548" stroke-width="3" stroke-dasharray="278" stroke-dashoffset="278" stroke-linecap="round" stroke-linejoin="round" >
<animate attributeName="stroke-dashoffset" values="278;278;0;0;278" keyTimes="0;.08;.29;.82;1" dur="16s" begin="0s" repeatCount="indefinite"/>
</path>

</svg>
