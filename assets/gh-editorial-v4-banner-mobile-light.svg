<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 306" role="img" aria-labelledby="title desc">
<title id="title">Tim Wong | Test AI. Turn complexity into clarity.</title>
<desc id="desc">A compact introduction to practical AI experiments and clear thinking.</desc>
<style>
@keyframes breathe {0%, 100% {opacity:.28} 42% {opacity:1}}
.breathe {animation:breathe 7.5s ease-in-out infinite;}
