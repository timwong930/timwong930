.breathe.three {animation-delay:5s;}
@media (prefers-reduced-motion: reduce) {.breathe {animation:none!important;opacity:.55!important;}}
</style>
<rect width="360" height="306" fill="#ffffff" />
<text x="21" y="31" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1" text-anchor="start" fill="#59636e">TIM WONG  /  BUILDING</text><line x1="21" y1="45" x2="337" y2="45" stroke="#d1d9e0" stroke-width="1" opacity="1"/>
 <text x="21" y="100" font-family="Georgia,'Times New Roman',serif" font-size="31" font-weight="700"  text-anchor="start" fill="#24292f">Test the limits of AI.</text>
