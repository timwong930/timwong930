  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1528"/><stop offset="1" stop-color="#141B35"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="1" fill="#7195CA" opacity=".15"/></pattern>
</defs>
<rect width="1080" height="170" rx="16" fill="url(#back)"/>
<rect width="1080" height="170" rx="16" fill="url(#dots)"/>
<text x="24" y="27" fill="#8DB4D4" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.1">EXPERIMENTS IN PROGRESS</text>
<circle cx="1053" cy="23" r="5" fill="#55E5C3" opacity=".95">
<animate attributeName="opacity" values=".25;1;.25" dur="3.5s" repeatCount="indefinite"/>
</circle>
