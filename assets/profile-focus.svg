<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 170" role="img" aria-labelledby="title desc">
  <title id="title">Current explorations</title>
  <desc id="desc">Three areas of focus: local first AI, agent workflows, and turning data into clarity.</desc>
  <defs>
