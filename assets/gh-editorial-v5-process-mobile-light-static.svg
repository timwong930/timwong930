<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" role="img" aria-labelledby="title desc">
<title id="title">How I work</title>
<desc id="desc">A vertical timeline showing five steps of practical problem solving.</desc>
<rect width="360" height="410" fill="#ffffff" />
<text x="22" y="28" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.1" text-anchor="start" fill="#59636e">FROM PROBLEM TO SOLUTION</text><line x1="23" y1="41" x2="336" y2="41" stroke="#d1d9e0" stroke-width="1" opacity="1"/><line x1="38" y1="72" x2="38" y2="384" stroke="#d1d9e0" stroke-width="1" opacity="1"/><circle cx="38" cy="78" r="4.5" fill="#4d6548" opacity=".55"></circle>
  <text x="60" y="82" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700"  text-anchor="start" fill="#895640">01</text>
  <text x="90" y="82" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="700"  text-anchor="start" fill="#24292f">NOTICE</text>
  <text x="90" y="103" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400"  text-anchor="start" fill="#59636e">Spot friction</text><circle cx="38" cy="144" r="4.5" fill="#4d6548" opacity=".55"></circle>
  <text x="60" y="148" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700"  text-anchor="start" fill="#895640">02</text>
  <text x="90" y="148" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="700"  text-anchor="start" fill="#24292f">UNDERSTAND</text>
  <text x="90" y="169" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400"  text-anchor="start" fill="#59636e">Read signals</text><circle cx="38" cy="210" r="4.5" fill="#4d6548" opacity=".55"></circle>
  <text x="60" y="214" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700"  text-anchor="start" fill="#895640">03</text>
  <text x="90" y="214" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="700"  text-anchor="start" fill="#24292f">BUILD</text>
  <text x="90" y="235" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400"  text-anchor="start" fill="#59636e">Create a fix</text><circle cx="38" cy="276" r="4.5" fill="#4d6548" opacity=".55"></circle>
  <text x="60" y="280" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700"  text-anchor="start" fill="#895640">04</text>
  <text x="90" y="280" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="700"  text-anchor="start" fill="#24292f">AUTOMATE</text>
  <text x="90" y="301" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400"  text-anchor="start" fill="#59636e">Save time</text><circle cx="38" cy="342" r="4.5" fill="#4d6548" opacity=".55"></circle>
  <text x="60" y="346" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700"  text-anchor="start" fill="#895640">05</text>
  <text x="90" y="346" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="700"  text-anchor="start" fill="#24292f">REFINE</text>
  <text x="90" y="367" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400"  text-anchor="start" fill="#59636e">Test and improve</text>
<circle cx="38" cy="78" r="5" fill="#895640"></circle>
</svg>
