<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 154" role="img" aria-labelledby="title desc">
<title id="title">How I work</title>
<desc id="desc">Five stages of problem solving, from noticing friction to improving the result.</desc>
<rect width="1080" height="154" fill="#0d1117" />
<line x1="34" y1="37" x2="1046" y2="37" stroke="#30363d" stroke-width="1" opacity="1"/><text x="35" y="23" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.55" text-anchor="start" fill="#a1aab4">FROM PROBLEM TO SOLUTION</text><circle cx="46" cy="62" r="4.5" fill="#b8ceb0" opacity=".55"></circle>
   <text x="37" y="104" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="0.9" text-anchor="start" fill="#d9a389">01</text>
   <text x="65" y="104" font-family="Georgia,'Times New Roman',serif" font-size="16" font-weight="700"  text-anchor="start" fill="#e6edf3">NOTICE</text>
   <text x="37" y="129" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="400"  text-anchor="start" fill="#a1aab4">Spot friction</text><circle cx="256" cy="62" r="4.5" fill="#b8ceb0" opacity=".55"></circle>
   <text x="247" y="104" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="0.9" text-anchor="start" fill="#d9a389">02</text>
   <text x="275" y="104" font-family="Georgia,'Times New Roman',serif" font-size="16" font-weight="700"  text-anchor="start" fill="#e6edf3">UNDERSTAND</text>
   <text x="247" y="129" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="400"  text-anchor="start" fill="#a1aab4">Read signals</text><circle cx="466" cy="62" r="4.5" fill="#b8ceb0" opacity=".55"></circle>
   <text x="457" y="104" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="0.9" text-anchor="start" fill="#d9a389">03</text>
   <text x="485" y="104" font-family="Georgia,'Times New Roman',serif" font-size="16" font-weight="700"  text-anchor="start" fill="#e6edf3">BUILD</text>
   <text x="457" y="129" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="400"  text-anchor="start" fill="#a1aab4">Create a fix</text><circle cx="676" cy="62" r="4.5" fill="#b8ceb0" opacity=".55"></circle>
   <text x="667" y="104" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="0.9" text-anchor="start" fill="#d9a389">04</text>
   <text x="695" y="104" font-family="Georgia,'Times New Roman',serif" font-size="16" font-weight="700"  text-anchor="start" fill="#e6edf3">AUTOMATE</text>
   <text x="667" y="129" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="400"  text-anchor="start" fill="#a1aab4">Save time</text><circle cx="886" cy="62" r="4.5" fill="#b8ceb0" opacity=".55"></circle>
   <text x="877" y="104" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="0.9" text-anchor="start" fill="#d9a389">05</text>
   <text x="905" y="104" font-family="Georgia,'Times New Roman',serif" font-size="16" font-weight="700"  text-anchor="start" fill="#e6edf3">REFINE</text>
   <text x="877" y="129" font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="400"  text-anchor="start" fill="#a1aab4">Test and improve</text>
<line x1="46" y1="62" x2="886" y2="62" stroke="#30363d" stroke-width="1.2" opacity=".75"/>
    <circle cx="46" cy="62" r="5" fill="#d9a389"></circle>
</svg>
