<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 323" role="img" aria-labelledby="title desc">
<title id="title">Tim Wong | Test AI. Turn complexity into clarity.</title>
<desc id="desc">A refined typographic profile introduction with an annotated side note.</desc>
<style>
@keyframes breathe {0%, 100% {opacity:.28} 42% {opacity:1}}
.breathe {animation:breathe 7.5s ease-in-out infinite;}
.breathe.two {animation-delay:2.5s;}
.breathe.three {animation-delay:5s;}
@media (prefers-reduced-motion: reduce) {.breathe {animation:none!important;opacity:.55!important;}}
</style>
<rect width="1200" height="323" fill="#ffffff" />
<text x="36" y="39" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4" text-anchor="start" fill="#59636e">TIM WONG   /   BUILDING</text><line x1="36" y1="57" x2="800" y2="57" stroke="#d1d9e0" stroke-width="1" opacity="1"/>
 <text x="36" y="128" font-family="Georgia,'Times New Roman',serif" font-size="51" font-weight="700"  text-anchor="start" fill="#24292f">Test the limits of AI.</text>
 <text x="36" y="188" font-family="Georgia,'Times New Roman',serif" font-size="48" font-weight="700"  text-anchor="start" fill="#4d6548">Turn complexity into clarity.</text>
 <text x="38" y="239" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400"  text-anchor="start" fill="#59636e">Curious by default. Building useful solutions and automations.</text>
 <line x1="37" y1="270" x2="799" y2="270" stroke="#d1d9e0" stroke-width="1" opacity="1"/>
 <text x="38" y="297" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.45" text-anchor="start" fill="#59636e">EXPERIMENT     /     UNDERSTAND     /     BUILD     /     REFINE</text>
 <line x1="844" y1="52" x2="844" y2="282" stroke="#d1d9e0" stroke-width="1" opacity="1"/>
 <text x="881" y="76" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1.15" text-anchor="start" fill="#895640">THE WORKING NOTE</text>
 <text x="881" y="127" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="400"  text-anchor="start" fill="#24292f">A question.</text>
 <text x="881" y="173" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="400"  text-anchor="start" fill="#24292f">An experiment.</text>
 <text x="881" y="219" font-family="Georgia,'Times New Roman',serif" font-size="28" font-weight="400"  text-anchor="start" fill="#24292f">A better way.</text>
 <line x1="880" y1="245" x2="1158" y2="245" stroke="#d1d9e0" stroke-width="1" opacity="1"/>
 <text x="881" y="278" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400"  text-anchor="start" fill="#59636e">Always curious. Always learning.</text>
 <circle cx="1152" cy="65" r="4" fill="#4d6548" class="breathe"/>
</svg>
