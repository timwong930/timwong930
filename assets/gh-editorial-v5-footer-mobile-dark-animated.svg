<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 122" role="img" aria-labelledby="title desc">
<title id="title">Build small. Learn fast. Make it useful.</title>
<desc id="desc">A compact closing message.</desc>

<rect width="360" height="122" fill="#0d1117" />
<rect x="0" y="8" width="360" height="105" rx="3" fill="#161b22"/>
 <text x="180" y="44" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700"  text-anchor="middle" fill="#e6edf3">Build small. Learn fast.</text>
 <text x="180" y="72" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700"  text-anchor="middle" fill="#e6edf3">Make it useful.</text>
 <text x="180" y="98" font-family="Arial,Helvetica,sans-serif" font-size="9.7" font-weight="700" letter-spacing="0.9" text-anchor="middle" fill="#a1aab4">ALWAYS CURIOUS. ALWAYS IMPROVING.</text>
<line x1="115" y1="108" x2="245" y2="108" stroke="#30363d" stroke-width="1.6"/>
    <circle cx="180" cy="108" r="3.3" fill="#b8ceb0"><animate attributeName="r" values="3.3;6;3.3" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;1;.4" dur="4.5s" repeatCount="indefinite"/></circle>
</svg>
