<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 492" role="img" aria-labelledby="title desc"><title id="title">From friction to function</title><desc id="desc">Five steps: notice, understand, build, automate, refine.</desc>
<rect width="360" height="492" rx="4" fill="#E9E6DC"/><rect x="9" y="9" width="342" height="474" fill="none" stroke="#D8D5C9"/>
<text x="25" y="37" font-family="Arial,Helvetica,sans-serif" font-size="12.4" font-weight="700" letter-spacing="1.4" fill="#56684D">FROM FRICTION TO FUNCTION</text>
<path d="M43 82 V427" fill="none" stroke="#B4B8AC" stroke-width="1.5"/><rect x="38.5" y="78.5" width="9" height="9" fill="#95543D" opacity="1"/>
<text x="74" y="89" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#242922">NOTICE</text>
<text x="75" y="113" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#4D594F">Spot the friction</text><rect x="38.5" y="164.5" width="9" height="9" fill="#56684D" opacity=".62"/>
<text x="74" y="175" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#242922">UNDERSTAND</text>
<text x="75" y="199" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#4D594F">Read the signals</text><rect x="38.5" y="250.5" width="9" height="9" fill="#56684D" opacity=".62"/>
<text x="74" y="261" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#242922">BUILD</text>
<text x="75" y="285" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#4D594F">Make the solution</text><rect x="38.5" y="336.5" width="9" height="9" fill="#56684D" opacity=".62"/>
<text x="74" y="347" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#242922">AUTOMATE</text>
<text x="75" y="371" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#4D594F">Free up the time</text><rect x="38.5" y="422.5" width="9" height="9" fill="#56684D" opacity=".62"/>
<text x="74" y="433" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#242922">REFINE</text>
<text x="75" y="457" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#4D594F">Test what works</text><rect x="37" y="77" width="12" height="12" fill="#95543D"></rect></svg>
