<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 298" role="img" aria-labelledby="title desc"><title id="title">Tim Wong: test AI, find clarity</title><desc id="desc">A mobile version of the profile banner with clear editorial typography.</desc>
