<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 107" role="img" aria-labelledby="title desc">
  <title id="title">Build small. Learn fast. Make it useful.</title>
  <desc id="desc">A compact footer carrying the profile motto.</desc>
  <defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55E5C3"/><stop offset=".53" stop-color="#67B8FF"/><stop offset="1" stop-color="#B398FF"/></linearGradient>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1528"/><stop offset="1" stop-color="#141B35"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="1" fill="#7195CA" opacity=".15"/></pattern>
</defs>
<rect width="1080" height="107" rx="16" fill="url(#back)"/>
<rect x="20" y="20" width="4" height="67" rx="2" fill="#55E5C3"/>
