<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 185" role="img" aria-labelledby="title desc">
<title id="title">From friction to function</title><desc id="desc">Five steps: notice, understand, build, automate, refine.</desc>
<rect width="1080" height="185" rx="5" fill="#E9E6DC"/>
<rect x="13" y="13" width="1054" height="159" rx="2" fill="none" stroke="#D8D5C9" stroke-width="1.3"/>
<path d="M103 59 H977" stroke="#B4B8AC" stroke-width="1.8" fill="none"/>
<line x1="103" y1="51" x2="103" y2="70" stroke="#56684D" stroke-width="2"/>
   <text x="103" y="39" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.5" fill="#4D594F">01</text>
   <text x="103" y="111" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="21.5" font-weight="700" fill="#242922">NOTICE</text>
   <text x="103" y="136" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4D594F">Spot the friction</text><line x1="321.5" y1="51" x2="321.5" y2="70" stroke="#56684D" stroke-width="2"/>
   <text x="321.5" y="39" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.5" fill="#4D594F">02</text>
   <text x="321.5" y="111" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="21.5" font-weight="700" fill="#242922">UNDERSTAND</text>
   <text x="321.5" y="136" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4D594F">Read the signals</text><line x1="540" y1="51" x2="540" y2="70" stroke="#56684D" stroke-width="2"/>
   <text x="540" y="39" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.5" fill="#4D594F">03</text>
   <text x="540" y="111" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="21.5" font-weight="700" fill="#242922">BUILD</text>
   <text x="540" y="136" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4D594F">Make the solution</text><line x1="758.5" y1="51" x2="758.5" y2="70" stroke="#56684D" stroke-width="2"/>
   <text x="758.5" y="39" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.5" fill="#4D594F">04</text>
   <text x="758.5" y="111" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="21.5" font-weight="700" fill="#242922">AUTOMATE</text>
   <text x="758.5" y="136" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4D594F">Free up the time</text><line x1="977" y1="51" x2="977" y2="70" stroke="#56684D" stroke-width="2"/>
   <text x="977" y="39" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.5" fill="#4D594F">05</text>
   <text x="977" y="111" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="21.5" font-weight="700" fill="#242922">REFINE</text>
   <text x="977" y="136" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4D594F">Test what works</text><rect x="99" y="54.5" width="9" height="9" fill="#95543D">
 
 </rect>
 </svg>
