<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 306" role="img" aria-labelledby="title desc">
<title id="title">Tim Wong | Test AI. Turn complexity into clarity.</title>
<desc id="desc">A compact introduction to practical AI experiments and clear thinking.</desc>
<rect width="360" height="306" fill="#0d1117" />
<text x="21" y="31" font-family="Arial,Helvetica,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1" text-anchor="start" fill="#a1aab4">TIM WONG  /  BUILDING</text><line x1="21" y1="45" x2="337" y2="45" stroke="#30363d" stroke-width="1" opacity="1"/>
 <text x="21" y="100" font-family="Georgia,'Times New Roman',serif" font-size="31" font-weight="700"  text-anchor="start" fill="#e6edf3">Test the limits of AI.</text>
 <text x="21" y="148" font-family="Georgia,'Times New Roman',serif" font-size="31" font-weight="700"  text-anchor="start" fill="#b8ceb0">Turn complexity</text>
 <text x="21" y="185" font-family="Georgia,'Times New Roman',serif" font-size="31" font-weight="700"  text-anchor="start" fill="#b8ceb0">into clarity.</text>
 <text x="22" y="223" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400"  text-anchor="start" fill="#a1aab4">Building useful solutions,</text>
 <text x="22" y="245" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400"  text-anchor="start" fill="#a1aab4">not just experiments.</text>
 <line x1="22" y1="270" x2="338" y2="270" stroke="#30363d" stroke-width="1" opacity="1"/>
 <text x="22" y="290" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" text-anchor="start" fill="#a1aab4">QUESTION  /  BUILD  /  REFINE</text>
 <circle cx="329" cy="27" r="3.5" fill="#b8ceb0"><animate attributeName="r" values="3.5;7;3.5" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".45;1;.45" dur="3.2s" repeatCount="indefinite"/></circle>
<circle cx="21" cy="45" r="3.4" fill="#d9a389"><animate attributeName="cx" values="21;337;21" keyTimes="0;.73;1" dur="10s" repeatCount="indefinite"/></circle>
